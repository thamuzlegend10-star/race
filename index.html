<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d21">
<title>Aurora GP</title>
<style>
  :root {
    --ink: #eef2ff; --muted: #9aa3d1; --line: rgba(255,255,255,.14); --glass: rgba(14,16,48,.78);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI Variable Display", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d21; color: var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .card { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: .45rem .8rem .5rem; min-width: 5rem; }
  .card span { display: block; font-size: .7rem; color: var(--muted); }
  .card b { display: block; font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .hud { position: fixed; display: flex; gap: 8px; pointer-events: none; }
  .tl { top: max(12px, env(safe-area-inset-top)); left: 12px; }
  .tr { top: max(12px, env(safe-area-inset-top)); right: 12px; }
  #speedo { position: fixed; left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: 11.5rem; pointer-events: none; }
  #speedo b { display: inline; font-size: 2rem; }
  #speedo small { color: var(--muted); font-weight: 700; margin-left: 4px; }
  .bar { height: 7px; border-radius: 6px; background: rgba(255,255,255,.12); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; }
  #sbar { background: linear-gradient(90deg, #5eead4, #ffc94a 65%, #ff4f6d); }
  #nbar { background: linear-gradient(90deg, #3b82f6, #5eead4); }
  #nbar.hot { background: linear-gradient(90deg, #ff8a2b, #ffe27a); }
  .nl { display: block; font-size: .66rem; color: var(--muted); margin-top: 7px; font-weight: 700; }
  #toast { position: fixed; top: 17%; left: 50%; transform: translateX(-50%); padding: .45rem 1.1rem; border-radius: 999px; font-weight: 800; font-size: 1.15rem; background: rgba(14,16,48,.85); border: 1px solid var(--line); opacity: 0; pointer-events: none; white-space: nowrap; }
  #toast.show { animation: toast 1.5s ease-out; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 12px) scale(.9); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -8px); } }
  #live { position: fixed; bottom: 22%; left: 50%; transform: translateX(-50%); font-size: 1.6rem; font-weight: 900; color: #ffe27a; text-shadow: 0 3px 14px rgba(0,0,0,.7); pointer-events: none; font-variant-numeric: tabular-nums; }
  #mini { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); width: 150px; height: 150px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line); pointer-events: none; }

  #center { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: clamp(4rem, 16vw, 9rem); font-weight: 900; letter-spacing: -.03em; text-shadow: 0 8px 40px rgba(0,0,0,.6); }
  #center.pop { animation: pop .5s ease-out; }
  @keyframes pop { from { transform: scale(1.6); opacity: 0; } }
  #wrong { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); padding: .5rem 1.1rem; border-radius: 12px; background: rgba(255,60,90,.85); font-weight: 800; display: none; pointer-events: none; }

  #screen { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,10,34,.78); padding: 20px; }
  #screen.hide { display: none; }
  .panel { width: min(30rem, 100%); padding: 1.6rem; border-radius: 22px; background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); border: 1px solid var(--line); box-shadow: 0 30px 70px -30px rgba(0,0,0,.8); }
  .panel h1 { margin: 0; font-size: 2.6rem; letter-spacing: -.03em; line-height: 1; }
  .panel p { color: var(--muted); margin: .5rem 0 1rem; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 1.2rem; font-size: .92rem; }
  kbd { display: inline-block; padding: .1rem .45rem; border-radius: 7px; background: rgba(255,255,255,.12); border: 1px solid var(--line); font: inherit; font-weight: 800; font-size: .82rem; }
  .laps { margin: 0 0 1.1rem; padding: 0; list-style: none; font-variant-numeric: tabular-nums; }
  .laps li { display: flex; justify-content: space-between; padding: .25rem 0; border-bottom: 1px solid var(--line); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; padding: .75rem 1.3rem; font-weight: 800; color: #04202c; background: linear-gradient(150deg, #5eead4, #3b82f6); }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid #9bdcff; outline-offset: 2px; }

  .tracks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 1.1rem; }
  .tk { text-align: left; padding: .65rem .7rem; color: var(--ink); background: rgba(255,255,255,.07); border: 1px solid var(--line); line-height: 1.25; }
  .tk:hover { background: rgba(255,255,255,.13); filter: none; }
  .tk.sel { border-color: #5eead4; background: rgba(94,234,212,.15); box-shadow: 0 0 0 1px #5eead4 inset; }
  .tk b { display: block; font-size: .95rem; }
  .tk span { display: block; font-size: .72rem; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .ghost { color: var(--ink); background: rgba(255,255,255,.1); border: 1px solid var(--line); margin-left: 8px; }
  #touch { display: none; }
  @media (pointer: coarse) {
    #touch { display: block; }
    #mini { bottom: 140px; width: 110px; height: 110px; }
    #speedo { bottom: 150px; }
    .tb { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); width: 4.6rem; height: 4.6rem; border-radius: 50%; display: grid; place-items: center; font-size: 1.7rem; font-weight: 800;
      background: var(--glass); border: 1px solid var(--line); color: var(--ink); padding: 0; }
    .tb.on { background: rgba(94,234,212,.35); }
    #tL { left: 14px; } #tR { left: calc(14px + 5.2rem); } #tG { right: 14px; } #tB { right: calc(14px + 5.2rem); }
    #tN { right: 14px; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 5.2rem); background: rgba(255,138,43,.35); }
  }
  @media (prefers-reduced-motion: reduce) { #center.pop, #toast.show { animation: none; opacity: 1; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud tl">
  <div class="card"><span>Position</span><b id="pos">4/4</b></div>
  <div class="card"><span>Lap</span><b id="lap">1/3</b></div>
  <div class="card"><span>Drift</span><b id="drift">0</b></div>
</div>
<div class="hud tr">
  <div class="card"><span>Lap time</span><b id="lt">—</b></div>
  <div class="card"><span>Best lap</span><b id="bl">—</b></div>
</div>
<div id="speedo" class="card"><b id="kmh">0</b><small>km/h</small><div class="bar"><i id="sbar"></i></div><span class="nl">Nitro · Shift</span><div class="bar"><i id="nbar"></i></div></div>
<canvas id="mini" width="300" height="300" aria-label="Track map"></canvas>
<div id="center" aria-live="assertive"></div>
<div id="wrong">Wrong way</div>
<div id="toast" aria-live="polite"></div>
<div id="live"></div>

<div id="touch">
  <button class="tb" id="tL" data-k="ArrowLeft" aria-label="Steer left">◀</button>
  <button class="tb" id="tR" data-k="ArrowRight" aria-label="Steer right">▶</button>
  <button class="tb" id="tB" data-k="ArrowDown" aria-label="Brake">▼</button>
  <button class="tb" id="tG" data-k="ArrowUp" aria-label="Gas">▲</button>
  <button class="tb" id="tN" data-k="Shift" aria-label="Nitro">N</button>
</div>

<div id="screen">
  <div class="panel" id="panel"></div>
</div>

<script>
//SIM-START
let HW = 62;
const LAPS = 3;
let CTRL = [];
const TRACKS = [
  { name: 'Aurora Circuit', tag: 'Balanced, one tight hairpin', hw: 80,
    theme: { bg: '#10353a', grass: '#13443f', speck: 'rgba(255,255,255,.035)', blade: 'rgba(80,200,150,.12)', road: '#2b2f55', roadHi: 'rgba(255,255,255,.05)', curb: '#ef4a5d', center: 'rgba(255,255,255,.38)', trees: ['#0d5a46', '#16805f', '#0f6b4f', '#1b9a70'], rock: ['#6b7096', '#8f95bd'] },
    ctrl: [
  [0, 0], [700, -40], [1400, -40], [1900, 250], [2000, 800], [1600, 1150], [1100, 950], [800, 1250],
  [900, 1800], [400, 2100], [-300, 1950], [-700, 1400], [-500, 900], [-900, 500], [-700, -50], [-350, -300],
  ] },
  { name: 'Sunset Speedway', tag: 'Fast, wide, flowing', hw: 94,
    theme: { bg: '#6e4a2a', grass: '#9a7040', speck: 'rgba(255,230,170,.07)', blade: 'rgba(255,220,150,.12)', road: '#3a3d49', roadHi: 'rgba(255,255,255,.05)', curb: '#ff8a2b', center: 'rgba(255,255,255,.4)', trees: ['#5d6b27', '#8a9b3c', '#6b7a2e', '#a3b44a'], rock: ['#8a6a58', '#b08d76'] },
    ctrl: [
  [0, 0], [900, -20], [1700, -20], [2300, 250], [2450, 800], [2200, 1250], [1500, 1400], [900, 1250],
  [500, 1400], [-100, 1300], [-500, 900], [-550, 350], [-350, 60],
  ] },
  { name: 'Neon Twister', tag: 'Twisty, technical', hw: 70,
    theme: { bg: '#1a1442', grass: '#241a5a', speck: 'rgba(170,140,255,.06)', blade: 'rgba(160,120,255,.14)', road: '#171a33', roadHi: 'rgba(120,140,255,.08)', curb: '#2fd8ff', center: 'rgba(255,255,255,.32)', trees: ['#3a1f7a', '#5a34b8', '#4a2a9a', '#6c45d6'], rock: ['#4a4f80', '#6a70a8'] },
    ctrl: [
  [0, 0], [875, -150], [1625, 125], [1688, 812], [1125, 1188], [1625, 1750], [1250, 2375],
  [500, 2188], [125, 2688], [-625, 2500], [-875, 1750], [-312, 1312], [-875, 812], [-688, 125],
  ] },
];
const TRK = {};
const MAXV = 560, ACC = 520, BRAKE = 1000, REVMAX = 170, TURN = 2.7, A_LAT = 560, AI_BRAKE = 520;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

function buildTrack(ti) {
  const def = TRACKS[ti];
  CTRL = def.ctrl; HW = def.hw;
  const n = CTRL.length, dense = [];
  for (let i = 0; i < n; i++) {
    const p0 = CTRL[(i - 1 + n) % n], p1 = CTRL[i], p2 = CTRL[(i + 1) % n], p3 = CTRL[(i + 2) % n];
    for (let s = 0; s < 60; s++) {
      const t = s / 60, t2 = t * t, t3 = t2 * t;
      const f = (k) => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      dense.push({ x: f(0), y: f(1) });
    }
  }
  const cum = [0];
  for (let i = 1; i <= dense.length; i++) {
    const a = dense[i - 1], b = dense[i % dense.length];
    cum.push(cum[i - 1] + Math.hypot(b.x - a.x, b.y - a.y));
  }
  const L = cum[cum.length - 1], N = Math.round(L / 8), sp = L / N;
  const pts = [];
  let j = 0;
  for (let i = 0; i < N; i++) {
    const target = i * sp;
    while (cum[j + 1] < target) j++;
    const f = (target - cum[j]) / (cum[j + 1] - cum[j]);
    const a = dense[j], b = dense[(j + 1) % dense.length];
    pts.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
  }
  const tan = [], nx = [], ny = [], curv = [];
  for (let i = 0; i < N; i++) {
    const a = pts[(i - 1 + N) % N], b = pts[(i + 1) % N];
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    tan.push(ang); nx.push(-Math.sin(ang)); ny.push(Math.cos(ang));
  }
  for (let i = 0; i < N; i++) curv.push(Math.abs(angDiff(tan[(i + 4) % N], tan[(i - 4 + N) % N])) / (8 * sp));
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of pts) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); }
  Object.assign(TRK, { pts, tan, nx, ny, curv, N, sp, L, bbox: { x0, y0, x1, y1 }, theme: def.theme });
}

function makeCar(idx, lane, color, skill, isPlayer) {
  const p = TRK.pts[idx];
  const c = {
    x: p.x + TRK.nx[idx] * lane, y: p.y + TRK.ny[idx] * lane, a: TRK.tan[idx], vx: 0, vy: 0, steer: 0,
    idx, P: idx, dist: Math.abs(lane), off: false, color, skill, lane: isPlayer ? 0 : lane * 0.6, isPlayer,
    maxCross: 0, lapStart: 0, laps: [], finished: false, finishT: 0, place: 0, braking: false, slip: 0, stuck: 0,
    baseSkill: skill, nitro: 0.4, padT: 0, boosting: false, drifting: false, newBest: false,
    px: 0, py: 0,
  };
  c.px = c.x; c.py = c.y;
  return c;
}

function nearest(c) {
  const { pts, N } = TRK;
  let best = 1e18, bi = c.idx;
  for (let k = -30; k <= 30; k++) {
    const j = (c.idx + k + N) % N, dx = c.x - pts[j].x, dy = c.y - pts[j].y, d = dx * dx + dy * dy;
    if (d < best) { best = d; bi = j; }
  }
  let delta = bi - c.idx;
  if (delta > N / 2) delta -= N; else if (delta < -N / 2) delta += N;
  c.P += delta; c.idx = bi; c.dist = Math.sqrt(best);
  c.off = c.dist > HW + 12;
}

function respawn(c) {
  const j = c.idx, p = TRK.pts[j];
  c.x = p.x; c.y = p.y; c.a = TRK.tan[j]; c.vx = c.vy = 0; c.steer = 0; c.stuck = 0; c.px = c.x; c.py = c.y;
  nearest(c);
}

function stepCar(c, inp, dt) {
  const ca = Math.cos(c.a), sa = Math.sin(c.a);
  let vf = c.vx * ca + c.vy * sa, vl = -c.vx * sa + c.vy * ca;
  const speed = Math.hypot(c.vx, c.vy);
  c.braking = false;
  const wantN = !!inp.nitro && c.nitro > 0.01;
  c.boosting = wantN || c.padT > 0;
  if (wantN) c.nitro = Math.max(0, c.nitro - dt * 0.5);
  if (c.padT > 0) c.padT -= dt;
  const mv = c.boosting ? MAXV * 1.3 : MAXV, acc = c.boosting ? ACC * 1.9 : ACC;
  if (inp.throttle > 0 || c.boosting) vf += acc * Math.max(0, 1 - vf / mv) * dt;
  if (inp.brake > 0) {
    if (vf > 12) { vf = Math.max(0, vf - BRAKE * dt); c.braking = true; }
    else vf = Math.max(-REVMAX, vf - 420 * dt);
  }
  vf -= vf * (c.off ? 1.5 : 0.28) * dt;
  if (!inp.throttle && !inp.brake) { const f = 60 * dt; vf = Math.abs(vf) < f ? 0 : vf - Math.sign(vf) * f; }
  if (inp.hb) vf -= vf * 0.9 * dt;
  const grip = inp.hb ? 1.5 : (c.off ? 3.6 : 7.5);
  vl *= Math.exp(-grip * dt);
  c.steer += (inp.steer - c.steer) * Math.min(1, 10 * dt);
  const turn = c.steer * TURN * clamp(vf / 150, -1, 1) * (1 - 0.35 * Math.min(1, Math.abs(vf) / MAXV)) * (inp.hb ? 1.35 : 1);
  c.slip = Math.abs(vl);
  c.drifting = c.slip > 130 && speed > 150;
  if (!c.boosting) c.nitro = Math.min(1, c.nitro + dt * (c.drifting && !c.off ? 0.3 : 0.02));
  c.vx = vf * ca - vl * sa; c.vy = vf * sa + vl * ca;
  c.a += turn * dt;
  c.px = c.x; c.py = c.y;
  c.x += c.vx * dt; c.y += c.vy * dt;
  nearest(c);
  if (speed < 25 && (inp.throttle > 0)) c.stuck += dt; else c.stuck = 0;
}

function aiInput(c) {
  const T = TRK, N = T.N, speed = Math.hypot(c.vx, c.vy);
  const look = 8 + Math.floor(speed / 28), ti = (c.idx + look) % N;
  const tx = T.pts[ti].x + T.nx[ti] * c.lane, ty = T.pts[ti].y + T.ny[ti] * c.lane;
  const diff = angDiff(Math.atan2(ty - c.y, tx - c.x), c.a);
  const steer = clamp(diff * 2.4, -1, 1);
  let target = MAXV * c.skill;
  const aLat = A_LAT * c.skill * c.skill;
  for (let k = 0; k <= 60; k += 6) {
    const cv = T.curv[(c.idx + k) % N];
    const vc = cv > 1e-5 ? Math.min(Math.sqrt(aLat / cv), 2.3 * c.skill / (cv + 0.0015)) : 9999;
    target = Math.min(target, Math.sqrt(vc * vc + 2 * AI_BRAKE * k * T.sp));
  }
  let throttle = speed < target ? 1 : 0, brake = speed > target + 25 ? 1 : 0;
  if (Math.abs(diff) > 0.9 && speed > 150) { throttle = 0; brake = 1; }
  return { throttle, brake, steer, hb: false };
}
//SIM-END

// ---------- Game / render ----------
(() => {
  const $ = (s) => document.querySelector(s);
  const cv = $('#game'), ctx = cv.getContext('2d');
  const mini = $('#mini'), mctx = mini.getContext('2d');
  const panel = $('#panel'), screenEl = $('#screen'), centerEl = $('#center'), wrongEl = $('#wrong');
  const toastEl = $('#toast'), liveEl = $('#live');
  const el = { pos: $('#pos'), lap: $('#lap'), lt: $('#lt'), bl: $('#bl'), kmh: $('#kmh'), drift: $('#drift'),
    sbar: $('#sbar'), nbar: $('#nbar') };
  const setText = (e, v) => { if (e._t !== v) { e.textContent = v; e._t = v; } };

  // ---- render size + adaptive quality ----
  let dprBase = 1, q = 1, W = 0, H = 0, res = 1, needDraw = 3;
  function resize() {
    dprBase = Math.min(window.devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight; res = dprBase * q;
    cv.width = Math.round(W * res); cv.height = Math.round(H * res); needDraw = 3;
  }
  addEventListener('resize', resize); resize();

  // ---- track visuals ----
  let grassPat = null;
  const props = [], pads = [];
  const mm = { s: 1, ox: 0, oy: 0, img: document.createElement('canvas') };

  function prepTrack() {
    const th = TRK.theme;
    const tile = document.createElement('canvas'); tile.width = tile.height = 256;
    const g = tile.getContext('2d');
    g.fillStyle = th.grass; g.fillRect(0, 0, 256, 256);
    let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 700; i++) { g.fillStyle = rnd() < .5 ? th.speck : 'rgba(0,0,0,.09)'; const w = 2 + rnd() * 6; g.fillRect(rnd() * 256, rnd() * 256, w, w); }
    g.strokeStyle = th.blade; g.lineWidth = 1.5;
    for (let i = 0; i < 160; i++) { const x = rnd() * 256, y = rnd() * 256; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd() * 5 - 2.5, y - 4 - rnd() * 5); g.stroke(); }
    grassPat = ctx.createPattern(tile, 'repeat');

    props.length = 0;
    let s2 = 12345 + trackIdx * 7771; const rnd2 = () => (s2 = (s2 * 16807) % 2147483647) / 2147483647;
    const b = TRK.bbox;
    for (let i = 0; i < 480; i++) {
      const x = b.x0 - 600 + rnd2() * (b.x1 - b.x0 + 1200), y = b.y0 - 600 + rnd2() * (b.y1 - b.y0 + 1200);
      let md = 1e9;
      for (let j = 0; j < TRK.N; j += 3) { const d = Math.hypot(x - TRK.pts[j].x, y - TRK.pts[j].y); if (d < md) md = d; }
      if (md < HW + 110) continue;
      props.push({ x, y, r: 16 + rnd2() * 30, rock: rnd2() < .15, h: rnd2() });
    }

    // boost pads on the flattest spots
    pads.length = 0;
    const N = TRK.N;
    for (const f of [0.1, 0.3, 0.5, 0.7, 0.88]) {
      let best = 0, bc = 1e9; const c0 = Math.floor(f * N);
      for (let k = -60; k <= 60; k++) { const j = (c0 + k + N) % N; if (TRK.curv[j] < bc) { bc = TRK.curv[j]; best = j; } }
      pads.push({ i: best, x: TRK.pts[best].x, y: TRK.pts[best].y, cd: 0 });
    }

    const size = 300, pad = 26;
    mm.s = (size - pad * 2) / Math.max(b.x1 - b.x0, b.y1 - b.y0);
    mm.ox = pad + ((size - pad * 2) - (b.x1 - b.x0) * mm.s) / 2 - b.x0 * mm.s;
    mm.oy = pad + ((size - pad * 2) - (b.y1 - b.y0) * mm.s) / 2 - b.y0 * mm.s;
    mm.img.width = mm.img.height = size;
    const m = mm.img.getContext('2d');
    m.clearRect(0, 0, size, size);
    m.lineJoin = m.lineCap = 'round'; m.strokeStyle = 'rgba(255,255,255,.75)'; m.lineWidth = 9;
    m.beginPath();
    TRK.pts.forEach((p, i) => { const x = p.x * mm.s + mm.ox, y = p.y * mm.s + mm.oy; i ? m.lineTo(x, y) : m.moveTo(x, y); });
    m.closePath(); m.stroke();

  }

  // ---- state ----
  const COLORS = ['#5eead4', '#ff6fb5', '#ffc94a', '#a78bfa'];
  let state = 'menu', cars = [], player = null, t = 0, cd = 0, goT = 0, finishedCount = 0, paused = false;
  let bestLap = Infinity, trackIdx = 0, lastPos = 4, frameNo = 0;
  let driftAcc = 0, driftTime = 0, driftGap = 0, driftTotal = 0, topSpeed = 0, shake = 0, impactCd = 0;
  const skids = [], parts = [], MAXP = 150;
  const cam = { x: 0, y: 0, z: 1, rot: 0 };
  let shC = [5, 7];
  const keyFor = (i) => 'auroraGP.best.' + i;
  const getBest = (i) => { try { const v = parseFloat(localStorage.getItem(keyFor(i))); return v > 0 ? v : Infinity; } catch (e) { return Infinity; } };
  const fmt = (x) => { const m = Math.floor(x / 60), s = x - m * 60; return m + ':' + s.toFixed(2).padStart(5, '0'); };
  function loadBest() { bestLap = getBest(trackIdx); setText(el.bl, bestLap < Infinity ? fmt(bestLap) : '—'); }

  function toast(txt) {
    toastEl.textContent = txt;
    toastEl.classList.remove('show'); void toastEl.offsetWidth; toastEl.classList.add('show');
  }

  // ---- sound (all synthesized, no files) ----
  const sfx = { ctx: null, master: null, muted: false };
  try { sfx.muted = localStorage.getItem('auroraGP.muted') === '1'; } catch (e) {}
  function initAudio() {
    if (sfx.ctx) { if (sfx.ctx.state === 'suspended') sfx.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const a = new AC(); sfx.ctx = a;
      const master = a.createGain(); master.gain.value = sfx.muted ? 0 : 0.5; master.connect(a.destination); sfx.master = master;
      const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
      const g = a.createGain(); g.gain.value = 0;
      const o1 = a.createOscillator(); o1.type = 'sawtooth';
      const o2 = a.createOscillator(); o2.type = 'square';
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(master); o1.start(); o2.start();
      Object.assign(sfx, { o1, o2, engG: g, engF: f });
      const len = a.sampleRate, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const ns = a.createBufferSource(); ns.buffer = buf; ns.loop = true;
      const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = .8;
      const sg = a.createGain(); sg.gain.value = 0;
      ns.connect(bp); bp.connect(sg); sg.connect(master); ns.start(); sfx.skidG = sg;
    } catch (e) { sfx.ctx = null; }
  }
  function beep(f0, dur, vol, type, f1) {

    const a = sfx.ctx, tn = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f0, tn);

    g.gain.setValueAtTime(vol || .14, tn); g.gain.exponentialRampToValueAtTime(.001, tn + dur);

  }
  function sfxUpdate(speed, throttle, drifting, on) {
    if (!sfx.ctx) return;
    const tn = sfx.ctx.currentTime, fr = 46 + speed * 0.2 + (player && player.boosting ? 16 : 0);
    sfx.o1.frequency.setTargetAtTime(fr, tn, 0.05); sfx.o2.frequency.setTargetAtTime(fr * 0.5, tn, 0.05);
    sfx.engG.gain.setTargetAtTime(on ? 0.05 + 0.07 * throttle + 0.03 * speed / MAXV : 0, tn, 0.08);
    sfx.engF.frequency.setTargetAtTime(450 + speed * 2.2, tn, 0.1);

  }
  function setMuted(m) {
    sfx.muted = m;
    if (sfx.master) sfx.master.gain.value = m ? 0 : 0.5;
    try { localStorage.setItem('auroraGP.muted', m ? '1' : '0'); } catch (e) {}
    toast(m ? 'Sound off' : 'Sound on');
  }

  // ---- particles ----
  function emit(x, y, vx, vy, life, size, grow, col, alpha) {
    if (parts.length >= MAXP) parts.shift();
    parts.push({ x, y, vx, vy, l: life, m: life, s: size, g: grow, c: col, a: alpha });
  }
  function updateParts(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.l -= dt;
      if (p.l <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.s += p.g * dt;
    }
  }
  function emitCar(c, dt) {
    const sp = Math.hypot(c.vx, c.vy), ca = Math.cos(c.a), sa = Math.sin(c.a);
    if (c.drifting && !c.off) {
      for (const sy of [-9, 9]) {
        if (Math.random() < .7) emit(c.x - 13 * ca - sy * sa, c.y - 13 * sa + sy * ca, (Math.random() - .5) * 30, (Math.random() - .5) * 30, .7, 7, 22, '#e6e9ff', .35);
      }
    } else if (c.off && sp > 100 && Math.random() < .8) {
      emit(c.x - 14 * ca, c.y - 14 * sa, (Math.random() - .5) * 50, (Math.random() - .5) * 50, .6, 6, 24, TRK.theme.dust || '#c9b38a', .4);
    }
    if (c.boosting) {
      for (let k = 0; k < 2; k++) {
        const col = ['#ffb02e', '#ff5a2e', '#fff2a8'][(Math.random() * 3) | 0];
        emit(c.x - 24 * ca + (Math.random() - .5) * 6, c.y - 24 * sa + (Math.random() - .5) * 6, -ca * 160 + c.vx * .3 + (Math.random() - .5) * 40, -sa * 160 + c.vy * .3 + (Math.random() - .5) * 40, .28, 6, -14, col, .9);
      }
    }
  }
  function sparks(x, y, n) {
    for (let k = 0; k < n; k++) emit(x, y, (Math.random() - .5) * 320, (Math.random() - .5) * 320, .3, 3, -6, '#ffe27a', 1);
  }

  // ---- race flow ----
  function newRace() {
    const N = TRK.N;
    cars = [
      makeCar(N - 22, -26, COLORS[1], 0.86, false),
      makeCar(N - 17, 26, COLORS[2], 0.78, false),
      makeCar(N - 12, -26, COLORS[3], 0.7, false),
      makeCar(N - 7, 26, COLORS[0], 1, true),
    ];
    player = cars[3];
    t = 0; finishedCount = 0; skids.length = 0; parts.length = 0; goT = 0; lastPos = 4;
    driftAcc = driftTime = driftGap = driftTotal = topSpeed = 0; shake = 0;
    pads.forEach((p) => p.cd = 0);
    cd = 3.6; state = 'countdown'; paused = false;
    cam.x = player.x; cam.y = player.y; cam.rot = -Math.PI / 2 - player.a;
    screenEl.classList.add('hide');
    initAudio();
  }

  function bootCars() {
    const N = TRK.N;
    cars = [makeCar(N - 22, -26, COLORS[1], .9, false), makeCar(N - 17, 26, COLORS[2], .9, false), makeCar(N - 12, -26, COLORS[3], .9, false), makeCar(N - 7, 26, COLORS[0], 1, true)];
    player = cars[3]; cam.x = player.x; cam.y = player.y; cam.z = 1.2; cam.rot = -Math.PI / 2 - player.a;
    skids.length = 0; parts.length = 0; state = 'menu'; paused = false; goT = 0; centerEl.textContent = ''; needDraw = 3;
    setText(el.drift, '0');
  }

  function selectTrack(i) { trackIdx = i; buildTrack(i); prepTrack(); loadBest(); bootCars(); }

  function showMenu() {
    const cards = TRACKS.map((tr, i) => {
      const b = getBest(i);
      return `<button class="tk${i === trackIdx ? ' sel' : ''}" data-i="${i}" aria-pressed="${i === trackIdx}"><b>${tr.name}</b><span>${tr.tag}</span><span>${b < Infinity ? 'Best ' + fmt(b) : 'No lap yet'}</span></button>`;
    }).join('');
    panel.innerHTML = `<h1>Aurora GP</h1><p>Pick a track. Three laps against three rivals. Drift to charge your nitro.</p>
      <div class="tracks">${cards}</div>
      <div class="keys"><span><kbd>↑</kbd> <kbd>W</kbd></span><span>Gas</span>
      <span><kbd>↓</kbd> <kbd>S</kbd></span><span>Brake, then reverse</span>
      <span><kbd>←</kbd> <kbd>→</kbd> <kbd>A</kbd> <kbd>D</kbd></span><span>Steer</span>
      <span><kbd>Space</kbd></span><span>Handbrake drift</span>
      <span><kbd>Shift</kbd></span><span>Nitro</span>
      <span><kbd>R</kbd> <kbd>P</kbd> <kbd>M</kbd></span><span>Reset, pause, mute</span></div>
      <button id="go">Start race</button>`;
    screenEl.classList.remove('hide');
    panel.querySelectorAll('.tk').forEach((b) => { b.onclick = () => { selectTrack(+b.dataset.i); showMenu(); }; });
    $('#go').onclick = newRace; $('#go').focus();
  }

  function onPlayerFinish() {
    const lapsHtml = player.laps.map((l, i) => `<li><span>Lap ${i + 1}</span><b>${fmt(l)}</b></li>`).join('');
    const place = player.place, suffix = ['th', 'st', 'nd', 'rd'][place > 3 ? 0 : place];
    panel.innerHTML = `<h1>${place}${suffix} place</h1><p>Total ${fmt(player.finishT)}${player.newBest ? '. New best lap!' : ''}</p>
      <ul class="laps">${lapsHtml}<li><span>Drift score</span><b>${driftTotal}</b></li><li><span>Top speed</span><b>${Math.round(topSpeed * 0.32)} km/h</b></li></ul>
      <button id="again">Race again</button><button class="ghost" id="tracks">Change track</button>`;
    state = 'finished';
    player.skill = 0.8; player.lane = 0;
    setTimeout(() => { screenEl.classList.remove('hide'); const b = $('#again'); b.onclick = newRace; $('#tracks').onclick = () => { selectTrack(trackIdx); showMenu(); }; b.focus(); }, 900);
  }

  // ---- input ----
  const keys = new Set();
  const norm = (k) => k.length === 1 ? k.toLowerCase() : k;
  addEventListener('keydown', (e) => {
    const k = norm(e.key);
    initAudio();
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) e.preventDefault();
    keys.add(k);
    if (k === 'm' && !e.repeat) setMuted(!sfx.muted);
    if (state === 'menu') {
      if (k === '1' || k === '2' || k === '3') { selectTrack(+k - 1); showMenu(); return; }
      if (k === 'ArrowRight' || k === 'ArrowLeft') { selectTrack((trackIdx + (k === 'ArrowRight' ? 1 : 2)) % 3); showMenu(); return; }
      if (document.activeElement && document.activeElement.classList.contains('tk')) return;
      if (k === 'Enter' || k === ' ') { newRace(); return; }
    }
    if (state === 'finished' && k === 'Enter' && !screenEl.classList.contains('hide')) newRace();
    if (k === 'r' && state === 'race' && !e.repeat) respawn(player);
    if ((k === 'p' || k === 'Escape') && (state === 'race' || state === 'countdown') && !e.repeat) {
      paused = !paused; liveEl.textContent = paused ? 'Paused' : ''; needDraw = 2;
    }
  });
  addEventListener('keyup', (e) => keys.delete(norm(e.key)));
  addEventListener('blur', () => keys.clear());
  document.querySelectorAll('.tb').forEach((b) => {
    const k = b.dataset.k;
    const on = (e) => { e.preventDefault(); initAudio(); keys.add(k); b.classList.add('on'); };
    const off = (e) => { e.preventDefault(); keys.delete(k); b.classList.remove('on'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  });
  const readInput = () => ({
    throttle: keys.has('ArrowUp') || keys.has('w') ? 1 : 0,
    brake: keys.has('ArrowDown') || keys.has('s') ? 1 : 0,
    steer: (keys.has('ArrowRight') || keys.has('d') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('a') ? 1 : 0),
    hb: keys.has(' '),
    nitro: keys.has('Shift'),
  });

  function collide() {
    const R = 19;
    for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++) {
      const a = cars[i], b = cars[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d >= R * 2 || d < 0.01) continue;
      const nx = dx / d, ny = dy / d, ov = R * 2 - d;
      a.x -= nx * ov / 2; a.y -= ny * ov / 2; b.x += nx * ov / 2; b.y += ny * ov / 2;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) {
        const imp = -rv * 0.6; a.vx -= nx * imp; a.vy -= ny * imp; b.vx += nx * imp; b.vy += ny * imp;
        if (imp > 30 && impactCd <= 0 && (a === player || b === player)) {

        }
      }
    }
  }

  function lapEvents(c) {
    const cr = Math.floor(c.P / TRK.N);
    if (cr <= c.maxCross) return;
    c.maxCross = cr;
    if (cr === 1) c.lapStart = t;
    else if (cr >= 2 && cr <= LAPS + 1) {
      const lt = t - c.lapStart; c.laps.push(lt); c.lapStart = t;
      if (c === player) {
        if (lt < bestLap) {
          bestLap = lt; setText(el.bl, fmt(lt)); c.newBest = true;
          try { localStorage.setItem(keyFor(trackIdx), String(lt)); } catch (e) {}
          toast('New best lap ' + fmt(lt));
        } else toast('Lap ' + (cr - 1) + ': ' + fmt(lt));
        beep(660, .12, .14, 'triangle'); setTimeout(() => beep(990, .2, .14, 'triangle'), 110);
      }
    }
    if (cr >= LAPS + 1 && !c.finished) {
      c.finished = true; c.finishT = t; c.place = ++finishedCount;
      if (c === player) onPlayerFinish();
    }
  }

  function update(dt) {
    if (state === 'countdown') {
      cd -= dt;
      if (cd <= 0.6) { state = 'race'; goT = 0.9; }
    }
    let inp = null;
    if (state === 'race' || state === 'finished') {
      t += dt; impactCd -= dt;
      for (const c of cars) if (!c.isPlayer && !c.finished) {
        const gap = (c.P - player.P) / TRK.N;
        c.skill = clamp(c.baseSkill * (1 - gap * 1.2), c.baseSkill * 0.9, c.baseSkill * 1.1);
      }
      const steps = 2, h = dt / steps;
      for (let s = 0; s < steps; s++) {
        for (const c of cars) {
          const ci = (c === player && !c.finished) ? (inp = readInput()) : aiInput(c);
          stepCar(c, ci, h);
          if (c.stuck > 3 || c.dist > HW + 520) { respawn(c); if (c === player) toast('Back on track'); }
          if (c.slip > 120 && Math.hypot(c.vx, c.vy) > 60 || (ci.hb && Math.hypot(c.vx, c.vy) > 120)) {
            const ca = Math.cos(c.a), sa = Math.sin(c.a);
            for (const sy of [-9, 9]) {
              const ox = -13 * ca - sy * sa, oy = -13 * sa + sy * ca;
              skids.push([c.px + ox, c.py + oy, c.x + ox, c.y + oy]);
            }
            if (skids.length > 700) skids.splice(0, 120);
          }
        }
        collide();
      }
      for (const c of cars) { lapEvents(c); emitCar(c, dt); }

      // boost pads (player)
      for (const p of pads) {
        if (p.cd > 0) { p.cd -= dt; continue; }
        const dx = player.x - p.x, dy = player.y - p.y;
        if (dx * dx + dy * dy < 1700) {
          p.cd = 1.5; player.padT = 1.4; player.nitro = Math.min(1, player.nitro + .15);
          toast('Boost pad!'); sparks(p.x, p.y, 10); beep(280, .35, .16, 'sawtooth', 900); shake = Math.min(1, shake + .35);
        }
      }

      // drift scoring
      const sp = Math.hypot(player.vx, player.vy);
      topSpeed = Math.max(topSpeed, sp);
      if (!player.finished) {
        if (player.drifting && !player.off) {
          driftAcc += dt * sp * 0.12 * (1 + Math.min(driftTime, 4) * 0.5); driftTime += dt; driftGap = 0;
        } else {
          driftGap += dt;
          if (player.off || driftGap > .35) {
            if (!player.off && driftTime > .5 && driftAcc >= 40) {
              const pts = Math.round(driftAcc); driftTotal += pts; toast('Drift +' + pts); beep(520, .1, .12, 'triangle');
            }
            driftAcc = 0; driftTime = 0;
          }
        }
      }
      if (goT > 0) goT -= dt;
    }
    updateParts(dt);
    shake = Math.max(0, shake - dt * 2.2);

    // camera
    const speed = Math.hypot(player.vx, player.vy);
    const base = clamp(Math.min(W, H) / 640, 0.6, 1.6);
    const tz = base * 1.15 * (1 - 0.1 * Math.min(1, speed / MAXV)) * (player.boosting ? 0.96 : 1);
    const k = Math.min(1, 6 * dt);
    cam.x += (player.x + player.vx * 0.2 - cam.x) * k;
    cam.y += (player.y + player.vy * 0.2 - cam.y) * k;
    cam.rot += angDiff(-Math.PI / 2 - player.a, cam.rot) * Math.min(1, 7 * dt);
    cam.z += (tz - cam.z) * Math.min(1, 3 * dt);
    hud(speed);
    sfxUpdate(speed, inp ? inp.throttle : 0, player.drifting, state === 'race' || state === 'finished');
  }

  let lastCenter = '';
  function hud(speed) {
    const order = cars.map((c) => ({ c, key: c.finished ? 1e9 - c.finishT : c.P })).sort((a, b) => b.key - a.key);
    const pos = order.findIndex((o) => o.c === player) + 1;
    if (state === 'race' && t > 1.5 && pos < lastPos) toast('Overtake! P' + pos);
    lastPos = pos;
    setText(el.pos, pos + '/' + cars.length);
    setText(el.lap, clamp(player.maxCross, 1, LAPS) + '/' + LAPS);
    setText(el.lt, player.maxCross >= 1 && !player.finished ? fmt(t - player.lapStart) : (player.finished ? 'Done' : '—'));
    setText(el.kmh, String(Math.round(speed * 0.32)));
    setText(el.drift, String(driftTotal));
    el.sbar.style.width = Math.min(100, speed / MAXV * 100 / 0.8) + '%';
    el.nbar.style.width = Math.round(player.nitro * 100) + '%';
    el.nbar.classList.toggle('hot', player.boosting);
    const T = TRK, i = player.idx;
    const vt = player.vx * Math.cos(T.tan[i]) + player.vy * Math.sin(T.tan[i]);
    const wrong = state === 'race' && vt < -60;
    if (wrongEl._w !== wrong) { wrongEl.style.display = wrong ? 'block' : 'none'; wrongEl._w = wrong; }
    const live = driftAcc > 30 ? 'Drift ' + Math.round(driftAcc / 10) * 10 : '';
    if (!paused) setText(liveEl, live);
    if (!paused) {
      let txt = '';
      if (state === 'countdown') txt = String(Math.max(1, Math.ceil(cd - 0.6)));
      else if (goT > 0) txt = 'GO!';
      if (txt !== lastCenter) {
        centerEl.textContent = txt; lastCenter = txt;
        centerEl.classList.remove('pop'); void centerEl.offsetWidth; if (txt) centerEl.classList.add('pop');
        if (txt === 'GO!') beep(880, .4, .16); else if (txt) beep(520, .14, .14);
      }
    }
  }

  // ---- drawing ----
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function shade(hex) {
    const n = parseInt(hex.slice(1), 16), f = 0.62;
    return `rgb(${((n >> 16) & 255) * f | 0},${((n >> 8) & 255) * f | 0},${(n & 255) * f | 0})`;
  }

  function drawCar(c) {
    ctx.save(); ctx.translate(c.x + shC[0], c.y + shC[1]); ctx.rotate(c.a);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(ctx, -22, -11, 44, 22, 7); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.a);
    if (c.isPlayer && !c.finished) {
      const g = ctx.createRadialGradient(70, 0, 0, 70, 0, 120);
      g.addColorStop(0, 'rgba(255,246,200,.2)'); g.addColorStop(1, 'rgba(255,246,200,0)');
      ctx.fillStyle = g; ctx.fillRect(10, -110, 190, 220);
    }
    ctx.fillStyle = '#0a0c1c';
    for (const [sx, sy] of [[13, -12], [13, 12], [-13, -12], [-13, 12]]) {
      ctx.save(); ctx.translate(sx, sy); if (sx > 0) ctx.rotate(c.steer * 0.5); ctx.fillRect(-5.5, -3, 11, 6); ctx.restore();
    }
    ctx.fillStyle = c.color; rr(ctx, -22, -10.5, 44, 21, 7); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(-22, 3, 44, 7.5);
    ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(-21, -2, 42, 4);
    ctx.fillStyle = '#0f1330'; rr(ctx, -5, -7, 14, 14, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)'; rr(ctx, -3, -6, 5, 12, 2); ctx.fill();
    ctx.fillStyle = '#fff6c2'; ctx.fillRect(20, -9, 3, 4); ctx.fillRect(20, 5, 3, 4);
    ctx.fillStyle = c.braking ? '#ff2d4d' : '#7a1426'; ctx.fillRect(-23, -9, 3, 4); ctx.fillRect(-23, 5, 3, 4);
    if (c.braking) { ctx.fillStyle = 'rgba(255,45,77,.35)'; ctx.fillRect(-34, -10, 12, 20); }
    ctx.restore();
  }

  // only stroke the parts of the track near the camera
  function buildRuns(R) {
    const step = 3, M = Math.floor(TRK.N / step), lim = (R + HW + 80) * (R + HW + 80), vis = new Array(M);
    let all = true;
    for (let m = 0; m < M; m++) {
      const p = TRK.pts[m * step], dx = p.x - cam.x, dy = p.y - cam.y;
      vis[m] = dx * dx + dy * dy < lim; if (!vis[m]) all = false;
    }
    const out = [];
    if (all) {
      const path = new Path2D();
      for (let m = 0; m < M; m++) { const p = TRK.pts[m * step]; m ? path.lineTo(p.x, p.y) : path.moveTo(p.x, p.y); }
      path.closePath(); out.push({ path, s: 0 }); return out;
    }
    let m = 0;
    while (m < M) {
      if (!vis[m]) { m++; continue; }
      const a = m; while (m < M && vis[m]) m++;
      const b = m - 1, path = new Path2D();
      for (let k = a - 1; k <= b + 1; k++) {
        const p = TRK.pts[(((k % M) + M) % M) * step];
        k === a - 1 ? path.moveTo(p.x, p.y) : path.lineTo(p.x, p.y);
      }
      out.push({ path, s: (a - 1) * step * TRK.sp });
    }
    return out;
  }
  function layer(runs, width, color, dash, period) {
    ctx.lineWidth = width; ctx.strokeStyle = color;
    if (dash) ctx.setLineDash(dash);
    for (const r of runs) {
      if (dash) ctx.lineDashOffset = ((r.s % period) + period) % period;
      ctx.stroke(r.path);
    }
    if (dash) { ctx.setLineDash([]); ctx.lineDashOffset = 0; }
  }

  function draw() {
    const s = res * cam.z, th = cam.rot, cs = Math.cos(th), sn = Math.sin(th);
    const jx = shake > 0 || (player && player.boosting) ? (Math.random() - .5) * (shake * 14 + (player.boosting ? 2.5 : 0)) * res : 0;
    const jy = jx ? (Math.random() - .5) * 2 * jx : 0;
    const cx = cv.width / 2 + jx, cy = cv.height * 0.68 + jy, T = TRK.theme;
    shC = [5 * cs + 7 * sn, -5 * sn + 7 * cs];
    const shP = [8 * cs + 10 * sn, -8 * sn + 10 * cs];
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = T.bg; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(s * cs, s * sn, -s * sn, s * cs, cx - s * (cs * cam.x - sn * cam.y), cy - s * (sn * cam.x + cs * cam.y));
    const R = Math.hypot(cv.width, cv.height) / s * 0.7 + 140, R2 = (R + 60) * (R + 60);
    ctx.fillStyle = grassPat; ctx.fillRect(cam.x - R, cam.y - R, R * 2, R * 2);

    for (const p of props) {
      const dx = p.x - cam.x, dy = p.y - cam.y;
      if (dx * dx + dy * dy > R2) continue;
      ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.arc(p.x + shP[0], p.y + shP[1], p.r, 0, 7); ctx.fill();
      if (p.rock) {
        ctx.fillStyle = T.rock[0]; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * .7, 0, 7); ctx.fill();
        ctx.fillStyle = T.rock[1]; ctx.beginPath(); ctx.arc(p.x - 3, p.y - 3, p.r * .4, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = p.h < .5 ? T.trees[0] : T.trees[2]; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
        ctx.fillStyle = p.h < .5 ? T.trees[1] : T.trees[3]; ctx.beginPath(); ctx.arc(p.x - p.r * .22, p.y - p.r * .22, p.r * .6, 0, 7); ctx.fill();
      }
    }

    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const runs = buildRuns(R);
    layer(runs, HW * 2 + 70, 'rgba(0,0,0,.2)');
    layer(runs, HW * 2 + 32, '#eef0ff');
    ctx.lineCap = 'butt'; layer(runs, HW * 2 + 32, T.curb, [34, 34], 68); ctx.lineCap = 'round';
    layer(runs, HW * 2, T.road);
    layer(runs, HW * 2 - 36, T.roadHi);
    ctx.lineCap = 'butt'; layer(runs, 3, T.center, [22, 28], 50); ctx.lineCap = 'round';

    // boost pads
    const pulse = .7 + .3 * Math.sin(frameNo * .18);
    for (const p of pads) {
      const dx = p.x - cam.x, dy = p.y - cam.y;
      if (dx * dx + dy * dy > R2) continue;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(TRK.tan[p.i]);
      ctx.fillStyle = `rgba(94,234,212,${.2 + .15 * pulse})`; rr(ctx, -34, -40, 68, 80, 10); ctx.fill();
      ctx.strokeStyle = `rgba(94,234,212,${.6 + .4 * pulse})`; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(k * 20 - 9, -22); ctx.lineTo(k * 20 + 9, 0); ctx.lineTo(k * 20 - 9, 22); ctx.stroke(); }
      ctx.restore();
    }

    // start line
    const p0 = TRK.pts[0];
    { const dx = p0.x - cam.x, dy = p0.y - cam.y;
      if (dx * dx + dy * dy < R2) {
        ctx.save(); ctx.translate(p0.x, p0.y); ctx.rotate(TRK.tan[0]);
        const rows = 10, rh = HW * 2 / rows;
        for (let r = 0; r < rows; r++) for (let c = 0; c < 2; c++) {
          ctx.fillStyle = (r + c) % 2 ? '#0d0f24' : '#f4f6ff'; ctx.fillRect(-12 + c * 12, -HW + r * rh, 12, rh);
        }
        ctx.restore();
      } }

    ctx.strokeStyle = 'rgba(5,6,20,.32)'; ctx.lineWidth = 4; ctx.lineCap = 'butt';
    ctx.beginPath();
    for (const q of skids) { const dx = q[0] - cam.x, dy = q[1] - cam.y; if (dx * dx + dy * dy > R2) continue; ctx.moveTo(q[0], q[1]); ctx.lineTo(q[2], q[3]); }
    ctx.stroke();

    for (const c of cars) if (c !== player) drawCar(c);
    drawCar(player);

    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.l / p.m) * p.a;
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(.5, p.s), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (frameNo % 2 === 0) {
      mctx.clearRect(0, 0, 300, 300);
      mctx.drawImage(mm.img, 0, 0);
      for (const c of cars) {
        mctx.fillStyle = c.color; mctx.beginPath();
        mctx.arc(c.x * mm.s + mm.ox, c.y * mm.s + mm.oy, c === player ? 11 : 8, 0, 7); mctx.fill();
        if (c === player) { mctx.strokeStyle = '#fff'; mctx.lineWidth = 3; mctx.stroke(); }
      }
    }
  }

  // ---- main loop with adaptive resolution ----
  let last = performance.now(), ema = 16, slowT = 0, fastT = 0;
  function frame(now) {
    const raw = now - last, dt = Math.min(0.033, raw / 1000); last = now;
    frameNo++;
    ema += (Math.min(raw, 100) - ema) * 0.05;
    if (state !== 'menu' && !paused) {
      if (ema > 24) { slowT += raw; fastT = 0; } else if (ema < 15) { fastT += raw; slowT = 0; } else { slowT = fastT = 0; }
      if (slowT > 1500 && q > 0.5) { q = Math.max(0.5, q * 0.8); slowT = 0; resize(); }
      else if (fastT > 8000 && q < 1) { q = Math.min(1, q * 1.25); fastT = 0; resize(); }
    }
    if (!paused) update(dt);
    if (state !== 'menu' || needDraw > 0 || frameNo % 8 === 0) { draw(); if (needDraw > 0) needDraw--; }
    requestAnimationFrame(frame);
  }

  selectTrack(0);
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
